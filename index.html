<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Social Media Report</title>
<style>
  :root{
    --paper:#f1f4f3; --card:#ffffff; --ink:#16231f; --mute:#4f625b; --line:#d5deda;
    --brand:#0f6b5c; --brand-d:#0a4d42; --soft:#e3efec; --warn:#fff4d6; --warn-ink:#7a5600; --bad:#b3261e;
    --rline:#4a665d; --rhead:#cfe3de;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding-bottom:84px}
  header{background:var(--brand-d);color:#fff;padding:14px 16px}
  header h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .datebar label{font-size:13px;opacity:.95}
  .datebar input{font:inherit;padding:7px 10px;border-radius:6px;border:0;color:var(--ink)}
  .datebar .hint{font-size:12.5px;opacity:.9;flex-basis:100%}
  nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;background:var(--paper);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
  nav button{border:0;background:transparent;font:inherit;padding:10px 14px;border-radius:8px 8px 0 0;color:var(--mute);cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--card);color:var(--brand-d);font-weight:600;box-shadow:inset 0 -3px 0 var(--brand)}
  main{max-width:1100px;margin:0 auto;padding:14px 12px}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:16px;color:var(--brand-d)}
  .sub{font-size:13px;color:var(--mute);margin:10px 0 6px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row span{flex:1}
  input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:#fff;max-width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .row input[type=number]{width:96px;text-align:right}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
  .f input,.f select{width:100%}
  .w{margin-top:10px;max-width:260px}
  table{border-collapse:collapse;width:100%}
  .ent th,.ent td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
  .ent th{color:var(--mute);font-weight:600;font-size:12.5px}
  .ent input[type=number]{width:84px;text-align:right}
  .collab{display:grid;grid-template-columns:1.2fr 90px 1.4fr 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .collab:last-child{border-bottom:0}
  .task{padding:8px 0;border-bottom:1px dashed var(--line)}
  .task:last-child{border-bottom:0}
  .task b{display:block;margin-bottom:5px}
  .task .two{display:grid;grid-template-columns:150px 1fr;gap:8px}
  textarea{width:100%;min-height:110px;resize:vertical}
  .status{background:var(--soft);padding:9px 12px;border-radius:8px;font-weight:600;color:var(--brand-d);margin-top:8px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:9}
  .bar button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:var(--brand-d)}
  .bar button.del{background:#fff;color:var(--bad);border:1px solid var(--bad)}
  .bar button.del:hover{background:#fdecea}
  .bar button:disabled{opacity:.55;cursor:wait}
  #msg{font-size:14px;color:var(--mute);flex:1}
  #msg.ok{color:var(--brand-d);font-weight:600}
  #msg.err{color:var(--bad);font-weight:600}
  .warn{background:var(--warn);color:var(--warn-ink);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600}
  #gate{max-width:340px;margin:60px auto;background:var(--card);padding:22px;border-radius:10px;border:1px solid var(--line)}
  #gate input{width:100%;margin:10px 0}
  #gate button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}

  /* generated report: bolder text, darker borders, stronger headers */
  .rhead{margin-bottom:12px}
  .rhead h2{margin:0 0 6px;font-size:21px;font-weight:800;color:#0a3d34}
  .rhead div{color:#26342f;font-size:14px;font-weight:600}
  .tw{overflow-x:auto;margin-bottom:18px;background:#fff;border:2px solid var(--rline);border-radius:8px}
  .rt{min-width:880px;font-size:14px;color:#0b1a16;font-weight:600}
  .rt th,.rt td{border:1.5px solid var(--rline);padding:6px 8px;text-align:right}
  .rt th{background:var(--rhead);color:#06352c;font-weight:800;text-align:center}
  .rt th.pl{text-align:left;font-size:15px;min-width:150px}
  .rt td.lb{text-align:left;font-weight:700}
  .rt td[rowspan]{vertical-align:middle;background:#f3f9f7;font-weight:800;font-size:15px}
  .rt tfoot td{font-weight:800;background:var(--rhead);font-size:15px}
  .ctr{text-align:center!important}
  .rbtn{background:#fff;border:1px solid var(--brand);color:var(--brand-d);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;margin:0 0 12px;font-weight:600}
  h4.rs{margin:24px 0 10px;font-size:17px;font-weight:800;color:#0a3d34;border-left:6px solid var(--brand);padding-left:10px}
  .box{white-space:pre-wrap;background:#fff;border:2px solid var(--rline);border-radius:8px;padding:10px;min-height:50px;margin-bottom:10px;font-weight:600;color:#0b1a16}

  @media (max-width:640px){
    .collab{grid-template-columns:1fr 1fr}
    .collab .nm{grid-column:1 / -1}
    .task .two{grid-template-columns:1fr}
    .bar{gap:8px;padding:8px 10px}
    .bar button{padding:11px 12px;font-size:14px}
  }
  @page{size:A4 landscape;margin:0}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    header,nav,.bar,.rbtn,.panel:not(#p-view),#gate{display:none!important}
    #p-view{display:block!important}
    body{background:#fff;padding:9mm 10mm;font-size:11px}
    main{max-width:none;padding:0;margin:0}
    .rhead h2{font-size:18px;margin:0 0 3px}
    .rhead div{font-size:12px}
    .tw{overflow:visible;border-radius:0;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
    .tw.big{break-inside:auto;page-break-inside:auto}
    .rt{min-width:0!important;width:100%;font-size:10.5px}
    .rt th,.rt td{padding:3px 4px;border-width:1px}
    .rt th.pl{min-width:0;font-size:11px}
    .rt td[rowspan],.rt tfoot td{font-size:11px}
    /* platform tables are forced to fit the page width, so the Spent report columns are never cut off */
    .rt.plat{table-layout:fixed;width:100%}
    .rt.plat th.pl{width:13%;font-size:11px}
    .rt.plat th,.rt.plat td{padding:3px 2px;font-size:9.5px;overflow-wrap:anywhere}
    .rt.plat td[rowspan]{font-size:10px}
    .rt.plat th{font-size:8.5px;padding:3px 1px;overflow-wrap:normal}
    .rt thead{display:table-header-group}
    .rt tr{break-inside:avoid;page-break-inside:avoid}
    h4.rs{font-size:13px;margin:12px 0 6px;break-after:avoid;page-break-after:avoid}
    .box{break-inside:avoid;page-break-inside:avoid}
  }
</style>
</head>
<body>

<div id="gate" style="display:none">
  <b>Enter access code</b>
  <input id="pin" type="password" autocomplete="off">
  <button onclick="startWithPin()">Open</button>
  <div id="gerr" style="color:var(--bad);margin-top:8px"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1 id="ttl">Social Media Daily Report</h1>
    <div class="datebar">
      <label for="dt"><b>1. Select the report date</b> (the day you are reporting, usually yesterday)</label>
      <input type="date" id="dt">
      <label for="from">Cumulative from</label>
      <input type="date" id="from">
      <span class="hint">Pick the date first, then fill the forms below. Daily columns show the date you pick. Cumulative shows from the start date to the end of the month and counts every saved day up to the report date. Saving a date again replaces that day.</span>
    </div>
  </header>

  <nav id="tabs">
    <button class="on" data-t="p1">1 · Social media</button>
    <button data-t="p2">2 · Groups &amp; orders</button>
    <button data-t="p3">3 · Tasks</button>
    <button data-t="view">Report</button>
  </nav>

  <main>
    <div class="panel on" id="p-p1"></div>
    <div class="panel" id="p-p2"></div>
    <div class="panel" id="p-p3"></div>
    <div class="panel" id="p-view"></div>
  </main>

  <div class="bar">
    <button id="save" onclick="save()">Save and update cumulative</button>
    <button id="del" class="del" onclick="delDay()">Delete this date</button>
    <div id="msg"></div>
  </div>
</div>

<script>
const METRICS=['Views','Reach','Click','Profile Visit','Follow/Subscribe','Interactions'];
let CUM_START='',LY=null, PIN='', TITLE='', REPORT=null, dirty=false, lastDate='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(x)?0:x};
const fmt=x=>Number(x||0).toLocaleString('en-IN');
const key=a=>esc(a.join('|'));
function call(fn,...a){
  const map={
    needsPin:{fn:'needsPin'},
    apiInit:{fn:'init',pin:a[0]},
    apiLoad:{fn:'load',pin:a[0],date:a[1],from:a[2]},
    apiSave:{fn:'save',pin:a[0],date:a[1],payload:a[2],from:a[3]},
    apiDelete:{fn:'delete',pin:a[0],date:a[1],from:a[2]}
  };
  return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(map[fn])})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Server error');return j.data;});
}
function say(t,c){const m=$('#msg');m.textContent=t||'';m.className=c||'';}

/* ---------- start ---------- */
(async function(){
  try{
    const need=await call('needsPin');
    if(need){$('#gate').style.display='block';}else{start();}
  }catch(e){document.body.innerHTML='<p style="padding:20px;color:#b3261e">'+esc(e.message)+'</p>';}
})();
function startWithPin(){PIN=$('#pin').value;start();}
async function start(){
  try{
    const r=await call('apiInit',PIN);
    LY=r.layout;TITLE=r.title;CUM_START=r.cumStart||'';
    $('#gate').style.display='none';$('#app').style.display='block';
    $('#ttl').textContent=TITLE;
    buildForms();
    const y=new Date(Date.now()-86400000);
    while(y.getDay()===0)y.setDate(y.getDate()-1);          // starts on the previous working day (Sunday skipped); user can pick any date
    $('#dt').value=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    lastDate=$('#dt').value;
    syncFrom(true);
    await loadDate();
  }catch(e){$('#gerr').textContent=e.message;$('#gate').style.display='block';}
}

/* ---------- tabs ---------- */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t));
  window.scrollTo(0,0);
});
function openTab(t){document.querySelector('#tabs button[data-t="'+t+'"]').click();}

document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.k){dirty=true;updStatus();}
});
function defFrom(d){return(CUM_START&&d.slice(0,7)===CUM_START.slice(0,7)&&d>=CUM_START)?CUM_START:d.slice(0,7)+'-01';}
function syncFrom(force){
  const d=$('#dt').value,f=$('#from').value;
  if(force||!f||f>d||f.slice(0,7)!==d.slice(0,7))$('#from').value=defFrom(d);
}
$('#dt').addEventListener('change',async()=>{
  if(!$('#dt').value){$('#dt').value=lastDate;return;}
  if(dirty&&!confirm('You have unsaved changes. Open another date and lose them?')){$('#dt').value=lastDate;return;}
  lastDate=$('#dt').value;syncFrom(false);await loadDate();
});
$('#from').addEventListener('change',async()=>{      // only recalculates the report, form is untouched
  if(!$('#from').value||$('#from').value>$('#dt').value){syncFrom(true);}
  say('Recalculating…');
  try{const r=await call('apiLoad',PIN,$('#dt').value,$('#from').value);renderReport(r.report);say('Cumulative now '+r.report.rangeLabel+'.','ok');}
  catch(e){say(e.message,'err');}
});

/* ---------- build entry forms ---------- */
function buildForms(){
  // REPORT 1
  let h='';
  LY.platforms.forEach(p=>{
    h+=`<section class="card"><h3>${esc(p.name)}</h3><div class="sub">Posts done on the selected date</div>`;
    p.items.forEach(it=>{h+=`<label class="row"><span>${esc(it)}</span><input type="number" min="0" inputmode="numeric" data-k="${key(['r1','plat',p.name,'posts',it])}"></label>`;});
    h+=`<div class="sub">${esc(p.name)} totals for the selected date (you can type N/A)</div><div class="g3">`;
    METRICS.forEach((m,i)=>{h+=`<label class="f">${m}<input type="text" inputmode="decimal" data-k="${key(['r1','plat',p.name,'met',i])}"></label>`;});
    h+='</div>';
    if(p.spend)h+=`<label class="f w">Spent (₹)<input type="text" inputmode="decimal" data-k="${key(['r1','plat',p.name,'spend'])}"></label>`;
    h+='</section>';
  });
  h+=`<section class="card"><h3>Collaborations</h3>`;
  LY.collab.forEach(c=>{
    h+=`<div class="collab"><b>${esc(c)}</b>
      <select data-k="${key(['r1','collab',c,'done'])}"><option value=""></option><option>Yes</option><option>No</option></select>
      <input class="nm" type="text" placeholder="Collaborator name" data-k="${key(['r1','collab',c,'name'])}">
      <input type="text" inputmode="numeric" placeholder="Views" data-k="${key(['r1','collab',c,'views'])}"></div>`;
  });
  h+='</section>';
  $('#p-p1').innerHTML=h;

  // REPORT 2
  h=`<section class="card"><h3>Facebook groups</h3><table class="ent"><thead><tr><th>No.</th><th>Group</th><th>Reel / Shorts</th><th>Catalog / Photo</th></tr></thead><tbody>`;
  LY.groups.forEach(g=>{
    h+=`<tr><td>${esc(g.no)}</td><td>${esc(g.name)}</td>
     <td><select data-k="${key(['r2','groups',g.no,'reel'])}"><option value=""></option><option>Yes</option></select></td>
     <td><select data-k="${key(['r2','groups',g.no,'photo'])}"><option value=""></option><option>Yes</option></select></td></tr>`;
  });
  h+=`</tbody></table></section><section class="card"><h3>Leads</h3>`;
  LY.leads.forEach(l=>{h+=`<label class="row"><span>${esc(l)}</span><input type="number" min="0" inputmode="numeric" data-k="${key(['r2','leads',l])}"></label>`;});
  h+=`</section><section class="card"><h3>Orders</h3><table class="ent"><thead><tr><th></th><th>PCS</th><th>Amount (₹)</th></tr></thead><tbody>`;
  LY.orders.forEach(o=>{
    h+=`<tr><td>${esc(o)}</td><td><input type="number" min="0" inputmode="numeric" data-k="${key(['r2','orders',o,'pcs'])}"></td>
     <td><input type="number" min="0" inputmode="decimal" style="width:120px" data-k="${key(['r2','orders',o,'amt'])}"></td></tr>`;
  });
  h+='</tbody></table></section>';
  $('#p-p2').innerHTML=h;

  // REPORT 3
  h=`<datalist id="ans"><option>Yes</option><option>No</option><option>Done</option><option>Pending</option></datalist><section class="card"><h3>Daily tasks</h3>`;
  LY.tasks.forEach((t,i)=>{
    h+=`<div class="task"><b>${i+1}. ${esc(t)}</b><div class="two">
      <input list="ans" placeholder="Answer" data-k="${key(['r3','tasks',i,'answer'])}">
      <input type="text" placeholder="If Yes, explain" data-k="${key(['r3','tasks',i,'details'])}"></div></div>`;
  });
  h+=`<div class="status" id="r3s"></div></section>`;
  LY.boxes.forEach((b,i)=>{h+=`<section class="card"><h3>${esc(b)}</h3><textarea data-k="${key(['r3','box',i])}"></textarea></section>`;});
  $('#p-p3').innerHTML=h;
}

const isDone=v=>/^(y|yes|done|complete|completed|✓|✔)/i.test(String(v||'').trim());
function updStatus(){
  let done=0;LY.tasks.forEach((t,i)=>{const el=document.querySelector('[data-k="r3|tasks|'+i+'|answer"]');if(el&&isDone(el.value))done++;});
  const s=$('#r3s');if(s)s.textContent='Total completed '+done+' / Pending '+(LY.tasks.length-done);
}

/* ---------- read / write form ---------- */
function collect(){
  const out={};let any=false;
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v=el.value.trim();if(v==='')return;
    any=true;const p=el.dataset.k.split('|');let o=out;
    for(let i=0;i<p.length-1;i++){o=o[p[i]]||(o[p[i]]={});}
    o[p[p.length-1]]=v;
  });
  return any?out:null;
}
function fill(data){
  document.querySelectorAll('[data-k]').forEach(el=>{
    let o=data;
    if(o){for(const k of el.dataset.k.split('|')){o=(o==null)?undefined:o[k];}}
    el.value=(data&&o!=null)?o:'';
  });
  dirty=false;updStatus();
}

/* ---------- server calls ---------- */
async function loadDate(){
  say('Loading…');
  try{
    const r=await call('apiLoad',PIN,$('#dt').value,$('#from').value);
    fill(r.saved);renderReport(r.report);
    say((new Date($('#dt').value+'T00:00:00').getDay()===0?'Note: this date is a Sunday. ':'')+(r.saved?'This date already has a saved report. You can edit and save again.':'No report saved for this date yet.'));
  }catch(e){say(e.message,'err');}
}
async function save(){
  const data=collect();
  if(!data){say('Nothing is filled in. Enter at least one value.','err');return;}
  const b=$('#save');b.disabled=true;say('Saving…');
  try{
    const r=await call('apiSave',PIN,$('#dt').value,data,$('#from').value);
    dirty=false;renderReport(r.report);
    say('Saved. Cumulative '+r.report.rangeLabel+' updated.','ok');
    openTab('view');
  }catch(e){say(e.message,'err');}
  b.disabled=false;
}
async function delDay(){
  if(!confirm('Delete the saved report for '+$('#dt').value+'? This cannot be undone.'))return;
  const b=$('#del');b.disabled=true;say('Deleting…');
  try{
    const r=await call('apiDelete',PIN,$('#dt').value,$('#from').value);
    fill(null);renderReport(r.report);
    say('Deleted. Cumulative updated.','ok');
  }catch(e){say(e.message,'err');}
  b.disabled=false;
}

/* ---------- generated report ---------- */
function renderReport(R){
  REPORT=R;
  const D=R.daily||{},C=R.cum,rng=R.rangeLabel;
  const dl='Daily ('+R.dayTo+' '+R.mon+')';                 // daily columns show the date the user selected
  const d1=D.r1||{},d2=D.r2||{},d3=D.r3||{};
  const v=x=>(x===undefined||x===null||x==='')?'':esc(x);
  const nice=new Date(R.date+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  let h=`<button class="rbtn" onclick="window.print()">Print / Save as PDF</button> <button class="rbtn" onclick="dlXlsx()">Download Excel</button>
   <div class="rhead"><h2>${esc(TITLE)}</h2><div>Daily: <b>${nice}</b> &nbsp;|&nbsp; Cumulative: <b>${rng}</b></div></div>`;

  /* REPORT 1 */
  let tD=0,tC=0;
  LY.platforms.forEach(p=>{
    const pd=(d1.plat||{})[p.name]||{},pc=(C.r1.plat||{})[p.name]||{posts:{},met:[0,0,0,0,0,0],spend:0};
    const pdm=pd.met||{},pdp=pd.posts||{},span=p.items.length;
    if(p.spend){tD+=num(pd.spend);tC+=num(pc.spend);}
    h+=`<div class="tw"><table class="rt plat"><thead><tr><th rowspan="2" class="pl">${esc(p.name)}</th><th colspan="2">Posts</th><th colspan="6">${dl}</th><th colspan="6">Cumulative (${rng})</th>${p.spend?'<th colspan="2">Spent report</th>':''}</tr>
      <tr><th>Daily</th><th>Cumulative</th>${METRICS.map(m=>'<th>'+m.replace('/','/<wbr>')+'</th>').join('')}${METRICS.map(m=>'<th>'+m.replace('/','/<wbr>')+'</th>').join('')}${p.spend?'<th>Daily</th><th>Cumulative</th>':''}</tr></thead><tbody>`;
    p.items.forEach((it,ix)=>{
      h+=`<tr><td class="lb">${esc(it)}</td><td>${v(pdp[it])}</td><td>${fmt(pc.posts[it])}</td>`;
      if(ix===0){
        for(let i=0;i<6;i++)h+=`<td rowspan="${span}">${v(pdm[i])}</td>`;
        for(let i=0;i<6;i++)h+=`<td rowspan="${span}">${fmt(pc.met[i])}</td>`;
        if(p.spend)h+=`<td rowspan="${span}">${v(pd.spend)}</td><td rowspan="${span}">${fmt(pc.spend)}</td>`;
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  });
  h+=`<div class="tw"><table class="rt" style="min-width:0"><thead><tr><th class="pl">Total spent (all platforms)</th><th>${dl}</th><th>Cumulative (${rng})</th></tr></thead><tbody><tr><td class="lb">₹</td><td>${fmt(tD)}</td><td>${fmt(tC)}</td></tr></tbody></table></div>`;

  /* collaborations */
  h+=`<h4 class="rs">Collaborations</h4><div class="tw"><table class="rt" style="min-width:0"><thead><tr><th class="pl">Item</th><th>Cum. Yes</th><th>Cum. No</th><th>Cum. views</th></tr></thead><tbody>`;
  LY.collab.forEach(c=>{const x=(C.r1.collab||{})[c]||{yes:0,no:0,views:0};h+=`<tr><td class="lb">${esc(c)}</td><td>${x.yes}</td><td>${x.no}</td><td>${fmt(x.views)}</td></tr>`;});
  h+='</tbody></table></div>';
  if(R.collabLog&&R.collabLog.length){
    h+=`<div class="tw"><table class="rt" style="min-width:0"><thead><tr><th>Date</th><th>Item</th><th>Collaborator</th><th>Views</th></tr></thead><tbody>`;
    R.collabLog.forEach(x=>{h+=`<tr><td class="ctr">${esc(x.date.slice(8,10)+'/'+x.date.slice(5,7))}</td><td class="lb">${esc(x.item)}</td><td class="lb">${esc(x.name)}</td><td>${fmt(x.views)}</td></tr>`;});
    h+='</tbody></table></div>';
  }

  /* REPORT 2 */
  const g2=d2.groups||{};
  h+=`<h4 class="rs">Report 2 · Facebook groups</h4><div class="tw big"><table class="rt" data-x="grp" style="min-width:560px"><thead><tr><th rowspan="2">No.</th><th rowspan="2" class="pl">Group</th><th colspan="2">${dl}</th><th colspan="2">Cumulative (${rng})</th></tr><tr><th>Reel / Shorts</th><th>Catalog / Photo</th><th>Reel / Shorts</th><th>Catalog / Photo</th></tr></thead><tbody>`;
  LY.groups.forEach(g=>{
    const dd=g2[g.no]||{},cc=(C.r2.groups||{})[g.no]||{reel:0,photo:0};
    h+=`<tr><td class="ctr">${esc(g.no)}</td><td class="lb">${esc(g.name)}</td><td>${v(dd.reel)}</td><td>${v(dd.photo)}</td><td>${fmt(cc.reel)}</td><td>${fmt(cc.photo)}</td></tr>`;
  });
  h+='</tbody></table></div>';
  h+=`<div class="tw"><table class="rt" style="min-width:0"><thead><tr><th class="pl">Leads</th><th>${dl}</th><th>Cumulative (${rng})</th></tr></thead><tbody>`;
  LY.leads.forEach(l=>{h+=`<tr><td class="lb">${esc(l)}</td><td>${v((d2.leads||{})[l])}</td><td>${fmt((C.r2.leads||{})[l])}</td></tr>`;});
  h+='</tbody></table></div>';
  let dp=0,da=0,cp=0,ca=0;
  h+=`<div class="tw"><table class="rt" style="min-width:0"><thead><tr><th rowspan="2" class="pl">Orders</th><th colspan="2">${dl}</th><th colspan="2">Cumulative (${rng})</th></tr><tr><th>PCS</th><th>Amount</th><th>PCS</th><th>Amount</th></tr></thead><tbody>`;
  LY.orders.forEach(o=>{
    const dd=(d2.orders||{})[o]||{},cc=(C.r2.orders||{})[o]||{pcs:0,amt:0};
    dp+=num(dd.pcs);da+=num(dd.amt);cp+=cc.pcs;ca+=cc.amt;
    h+=`<tr><td class="lb">${esc(o)}</td><td>${v(dd.pcs)}</td><td>${v(dd.amt)}</td><td>${fmt(cc.pcs)}</td><td>${fmt(cc.amt)}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td class="lb">TOTAL ORDER</td><td>${fmt(dp)}</td><td>${fmt(da)}</td><td>${fmt(cp)}</td><td>${fmt(ca)}</td></tr></tfoot></table></div>`;

  /* REPORT 3 */
  const t3=d3.tasks||{};let done=0;
  h+=`<h4 class="rs">Report 3 · Daily tasks (${R.dayTo} ${R.mon})</h4><div class="tw"><table class="rt" style="min-width:0"><thead><tr><th>No.</th><th class="pl">Task</th><th>Answer</th><th>If Yes, explain</th></tr></thead><tbody>`;
  LY.tasks.forEach((t,i)=>{
    const x=t3[i]||{};if(isDone(x.answer))done++;
    h+=`<tr><td class="ctr">${i+1}</td><td class="lb">${esc(t)}</td><td class="ctr">${v(x.answer)}</td><td class="lb">${v(x.details)}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td colspan="4" class="lb">Total completed ${done} / Pending ${LY.tasks.length-done}</td></tr></tfoot></table></div>`;
  LY.boxes.forEach((b,i)=>{h+=`<h4 class="rs">${esc(b)}</h4><div class="box">${v((d3.box||{})[i])}</div>`;});

  $('#p-view').innerHTML=h;
}

/* ---------- Excel export (.xlsx, built in the browser, no library) ---------- */
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
function readTable(t){
  const cells=[],occ={};let r=0,maxc=0;
  t.querySelectorAll('tr').forEach(tr=>{
    let c=0;
    tr.querySelectorAll('th,td').forEach(td=>{
      while(occ[r+','+c])c++;
      const rs=td.rowSpan||1,cs=td.colSpan||1;
      for(let i=0;i<rs;i++)for(let j=0;j<cs;j++)occ[(r+i)+','+(c+j)]=1;
      cells.push({r,c,rs,cs,text:td.textContent.replace(/\s+/g,' ').trim(),th:td.tagName==='TH',ctr:td.classList.contains('ctr'),foot:!!td.closest('tfoot'),span:td.tagName==='TD'&&td.hasAttribute('rowspan')});
      c+=cs;if(c>maxc)maxc=c;
    });
    r++;
  });
  return {cells,rows:r,cols:maxc};
}
function mergeNo(tb){                       // groups table: "No." + "Group" become one column "1. Minu Club"
  const nos={};
  tb.cells.forEach(x=>{if(x.c===0&&!x.th)nos[x.r]=x.text;});
  tb.cells=tb.cells.filter(x=>x.c!==0).map(x=>{x.c-=1;if(!x.th&&x.c===0&&nos[x.r])x.text=nos[x.r]+'. '+x.text;return x;});
  tb.cols-=1;
}
function newSheet(w){return {rows:{},ht:{},merges:[],r:0,w};}
function put(sh,r,c,v,s){(sh.rows[r]||(sh.rows[r]={}))[c]={v,s};}
function addTable(sh,tb){
  const base=sh.r;
  tb.cells.forEach(x=>{
    const isNum=x.text!==''&&/^-?[\d,]+(\.\d+)?$/.test(x.text);
    const val=isNum?parseFloat(x.text.replace(/,/g,'')):x.text;
    const dec=isNum&&!Number.isInteger(val);
    let s;
    if(x.th)s=3;
    else if(x.foot)s=isNum?(dec?13:9):8;
    else if(isNum||x.text==='')s=x.span?(dec?12:7):(dec?11:6);
    else s=x.ctr?5:4;
    put(sh,base+x.r,x.c,x.text===''?null:val,s);
    if(x.rs>1||x.cs>1){
      sh.merges.push(colName(x.c)+(base+x.r+1)+':'+colName(x.c+x.cs-1)+(base+x.r+x.rs));
      for(let i=0;i<x.rs;i++)for(let j=0;j<x.cs;j++)if(i||j)put(sh,base+x.r+i,x.c+j,null,s);
    }
    if(x.th)sh.ht[base+x.r]=32;
  });
  sh.r=base+tb.rows+1;
}
function sheetXml(sh){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>'
   +sh.w.map((n,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+n+'" customWidth="1"/>').join('')+'</cols><sheetData>';
  Object.keys(sh.rows).map(Number).sort((a,b)=>a-b).forEach(r=>{
    x+='<row r="'+(r+1)+'"'+(sh.ht[r]?' ht="'+sh.ht[r]+'" customHeight="1"':'')+'>';
    Object.keys(sh.rows[r]).map(Number).sort((a,b)=>a-b).forEach(c=>{
      const o=sh.rows[r][c],ref=colName(c)+(r+1);
      if(o.v===null||o.v==='')x+='<c r="'+ref+'" s="'+o.s+'"/>';
      else if(typeof o.v==='number')x+='<c r="'+ref+'" s="'+o.s+'"><v>'+o.v+'</v></c>';
      else x+='<c r="'+ref+'" s="'+o.s+'" t="inlineStr"><is><t xml:space="preserve">'+xe(o.v)+'</t></is></c>';
    });
    x+='</row>';
  });
  x+='</sheetData>';
  if(sh.merges.length)x+='<mergeCells count="'+sh.merges.length+'">'+sh.merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>';
  return x+'<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>';
}
const STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
 +'<numFmts count="1"><numFmt numFmtId="164" formatCode="[&gt;=10000000]##\\,##\\,##\\,##0;[&gt;=100000]##\\,##\\,##0;##,##0"/></numFmts>'
 +'<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="15"/><color rgb="FF0A3D34"/><name val="Calibri"/></font><font><b/><sz val="12"/><color rgb="FF0A3D34"/><name val="Calibri"/></font></fonts>'
 +'<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFCFE3DE"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF3F9F7"/><bgColor indexed="64"/></patternFill></fill></fills>'
 +'<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF4A665D"/></left><right style="thin"><color rgb="FF4A665D"/></right><top style="thin"><color rgb="FF4A665D"/></top><bottom style="thin"><color rgb="FF4A665D"/></bottom><diagonal/></border></borders>'
 +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="14">'
 +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
 +'<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
 +'<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
 +'<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
 +'<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>'
 +'<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'
 +'<xf numFmtId="164" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'<xf numFmtId="164" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>'
 +'<xf numFmtId="164" fontId="1" fillId="2" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf>'
 +'<xf numFmtId="4" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'<xf numFmtId="4" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'<xf numFmtId="4" fontId="1" fillId="2" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
 +'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipFiles(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  let cs=0;cen.forEach(p=>cs+=p.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(end.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function dlXlsx(){
  const root=$('#p-view');
  if(!REPORT||!root.children.length){say('Open a date first.','err');return;}
  const widths=[
    [34].concat(Array(16).fill(13)),
    [44,18,18,18,18,18],
    [6,52,14,46]
  ];
  const names=['Report 1','Report 2','Report 3'];
  const sh=widths.map(w=>newSheet(w));
  const title=root.querySelector('.rhead h2'),sub=root.querySelector('.rhead div');
  sh.forEach(s=>{put(s,0,0,title?title.textContent:TITLE,1);put(s,1,0,sub?sub.textContent.replace(/\s+/g,' ').trim():'',0);s.r=3;});
  let cur=0;
  Array.from(root.children).forEach(el=>{
    if(el.tagName==='H4'){
      const t=el.textContent.trim();
      if(/^Report 2/.test(t))cur=1;else if(/^Report 3/.test(t))cur=2;
      put(sh[cur],sh[cur].r,0,t,2);sh[cur].r+=1;
    }else if(el.classList.contains('tw')){
      const t=el.querySelector('table');if(!t)return;
      const tb=readTable(t);if(t.dataset.x==='grp')mergeNo(tb);
      addTable(sh[cur],tb);
    }else if(el.classList.contains('box')){
      const s=sh[cur],r=s.r,n=widths[cur].length>4?4:widths[cur].length;
      put(s,r,0,el.textContent.trim(),10);
      for(let c=1;c<4;c++)put(s,r,c,null,10);
      s.merges.push('A'+(r+1)+':D'+(r+1));s.ht[r]=60;s.r=r+2;
    }
  });
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[
    {name:'[Content_Types].xml',text:X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sh.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'},
    {name:'_rels/.rels',text:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+names.map((n,i)=>'<sheet name="'+n+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sh.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',text:STYLES}
  ].concat(sh.map((s,i)=>({name:'xl/worksheets/sheet'+(i+1)+'.xml',text:sheetXml(s)})));
  const url=URL.createObjectURL(zipFiles(files));
  const a=document.createElement('a');a.href=url;a.download='Social_Media_Report_'+REPORT.date+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  say('Excel downloaded.','ok');
}
